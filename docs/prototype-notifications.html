<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知中心 — IELTS Buddy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,18..32,300..700;1,18..32,300..700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap');

:root {
  --bg-primary: #0f1a12;
  --bg-card: #1e3022;
  --bg-elevated: #243828;
  --accent-green: #6ec56e;
  --accent-gold: #e8b84b;
  --accent-amber: #c4893a;
  --text-primary: #f4f0e6;
  --text-secondary: #b8c4a8;
  --text-muted: #7a9170;
  --border-subtle: #2a3d2c;
  --success: #6ec56e;
  --danger: #e85b4b;
  --info: #5b9bd5;
  --radius-md: 16px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 40px 16px;
}

.page-content {
  width: 100%;
  max-width: 560px;
}

/* ---------- header ---------- */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 24px;
}
.page-header-left h1 {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 28px;
  letter-spacing: 0.01em;
  color: var(--text-primary);
  line-height: 1.2;
}
.page-header-left .subtitle {
  font-size: 14px;
  color: var(--text-muted);
  margin-top: 4px;
  font-weight: 400;
}
.mark-all-btn {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent-green);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 7px 14px;
  cursor: pointer;
  transition: 0.2s;
  font-family: 'DM Sans', sans-serif;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 4px;
}
.mark-all-btn:hover {
  background: var(--accent-green);
  color: #0f1a12;
  border-color: var(--accent-green);
}

/* ---------- filter tabs ---------- */
.filter-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.filter-tab {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1px solid var(--border-subtle);
  background: transparent;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: 0.2s;
  font-family: 'DM Sans', sans-serif;
}
.filter-tab:hover {
  border-color: var(--text-muted);
  color: var(--text-primary);
}
.filter-tab.active {
  background: var(--accent-green);
  border-color: var(--accent-green);
  color: #0f1a12;
  font-weight: 600;
}

/* ---------- notification list ---------- */
.notif-list {
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ---------- notification item ---------- */
.notif-item {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 10px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  transition: 0.2s;
}
.notif-item.read {
  opacity: 0.55;
}
.notif-item.read:hover {
  opacity: 0.8;
}

/* unread dot (left side) */
.unread-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--info);
  flex-shrink: 0;
  margin-top: 5px;
}

/* icon area */
.notif-icon {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

/* body */
.notif-body {
  flex: 1;
  min-width: 0;
}
.notif-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 4px;
  gap: 8px;
}
.notif-title {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
}
.notif-time {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.notif-text {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.45;
  margin-bottom: 10px;
}

/* action buttons */
.notif-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: 0.2s;
  border: 1px solid transparent;
  white-space: nowrap;
}
.btn-green {
  background: var(--accent-green);
  color: #0f1a12;
  border-color: var(--accent-green);
}
.btn-green:hover {
  filter: brightness(1.1);
}
.btn-outline {
  background: transparent;
  border-color: var(--border-subtle);
  color: var(--text-secondary);
}
.btn-outline:hover {
  border-color: var(--text-muted);
  color: var(--text-primary);
}
.btn-ghost-green {
  background: transparent;
  border: none;
  color: var(--accent-green);
}
.btn-ghost-green:hover {
  color: var(--accent-gold);
}

/* ---------- footer link ---------- */
.footer-link {
  text-align: center;
  margin-top: 20px;
  padding-bottom: 40px;
}
.footer-link a {
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  transition: 0.2s;
}
.footer-link a:hover {
  color: var(--accent-green);
}
.footer-link a::before {
  content: '\2699\FE0F\0020';
}

/* ---------- responsive ---------- */
@media (max-width: 480px) {
  body { padding: 24px 12px; }
  .page-header { flex-direction: column; gap: 12px; }
  .mark-all-btn { margin-top: 0; align-self: flex-start; }
  .notif-item { flex-wrap: wrap; }
  .unread-dot { display: none; }
}
</style>
</head>
<body>

</body>
</html>
